# GitHub Actions Workflow created for handling the release process based on the draft release prepared with the Build workflow.
# Running the publishPlugin task requires all the following secrets to be provided: PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD, CERTIFICATE_CHAIN.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.

name: Release
on:
  release:
    types: [ prereleased, released ]

jobs:

  # Prepare and publish the plugin to JetBrains Marketplace repository
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: true

      # Update the Unreleased section with the current release note
      - name: Patch Changelog
        if: ${{ github.event.release.body != '' }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          echo "$CHANGELOG" > $RELEASE_NOTE

          ./gradlew patchChangelog --release-note-file=$RELEASE_NOTE

      # Publish the plugin to JetBrains Marketplace
      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # Upload an artifact as a release asset
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ./build/distributions/*

      # Create a pull request
      - name: Create Pull Request
        if: ${{ github.event.release.body != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          BRANCH="changelog-update-$VERSION"
          LABEL="release changelog"
          HEAD_SHA="$(git rev-parse HEAD)"

          # Commit through the GitHub API instead of pushing a local commit, as GitHub signs the commits it
          # creates and the main branch only accepts signed commits
          # Reset the branch instead when a failed earlier run already created it, so the job can be re-run
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$BRANCH" \
            -f sha="$HEAD_SHA" \
            || gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" \
              -f sha="$HEAD_SHA" \
              -F force=true

          # Pass the content through a file, as a large changelog could exceed the command-line argument limit
          CHANGELOG_BASE64="$RUNNER_TEMP/changelog.base64"
          base64 -w0 CHANGELOG.md > "$CHANGELOG_BASE64"

          # shellcheck disable=SC2016 # $variables in the query are GraphQL variables
          gh api graphql \
            -f repository="$GITHUB_REPOSITORY" \
            -f branch="$BRANCH" \
            -f headSha="$HEAD_SHA" \
            -f message="Changelog update - $VERSION" \
            -F changelog="@$CHANGELOG_BASE64" \
            -f query='
              mutation ($repository: String!, $branch: String!, $headSha: GitObjectID!, $message: String!, $changelog: Base64String!) {
                createCommitOnBranch(input: {
                  branch: { repositoryNameWithOwner: $repository, branchName: $branch }
                  message: { headline: $message }
                  expectedHeadOid: $headSha
                  fileChanges: { additions: [{ path: "CHANGELOG.md", contents: $changelog }] }
                }) {
                  commit { url }
                }
              }'

          gh label create "$LABEL" \
            --description "Pull requests with release changelog update" \
            --force \
            || true

          gh pr create \
            --title "Changelog update - \`$VERSION\`" \
            --body "Current pull request contains patched \`CHANGELOG.md\` file for the \`$VERSION\` version." \
            --label "$LABEL" \
            --head $BRANCH
